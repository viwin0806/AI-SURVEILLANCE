{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h2>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Threat Alerts
    </h2>
    <div class="page-actions">
        <select id="alertFilter" class="form-select" onchange="filterAlerts()">
            <option value="">All Levels</option>
            <option value="CRITICAL">Critical</option>
            <option value="HIGH_RISK">High Risk</option>
        </select>
    </div>
</div>

<div class="alerts-container" id="alertsContainer">
    <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading alerts...</p>
    </div>
</div>

<div class="pagination" id="alertsPagination"></div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 0;
const pageSize = 20;

async function loadAlerts(offset = 0) {
    const filter = document.getElementById('alertFilter').value;
    let url = `/api/alerts_data?limit=${pageSize}&offset=${offset}`;
    if (filter) url += `&threat_level=${filter}`;
    
    try {
        const res = await fetch(url);
        const data = await res.json();
        renderAlerts(data.alerts, data.total);
    } catch (e) {
        document.getElementById('alertsContainer').innerHTML = 
            '<div class="empty-state"><p>Failed to load alerts</p></div>';
    }
}

function renderAlerts(alerts, total) {
    const container = document.getElementById('alertsContainer');
    
    if (!alerts || alerts.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                <h3>No alerts found</h3>
                <p>Alerts are generated when threat levels reach HIGH RISK or CRITICAL</p>
            </div>`;
        return;
    }
    
    let html = '';
    for (const alert of alerts) {
        const levelClass = alert.threat_level.toLowerCase().replace('_', '-');
        const breakdown = alert.breakdown || {};
        
        html += `
        <div class="alert-card alert-${levelClass}">
            <div class="alert-card-header">
                <div class="alert-severity">
                    <span class="severity-badge severity-${levelClass}">${alert.threat_level.replace('_', ' ')}</span>
                    <span class="alert-score">Score: ${alert.threat_score.toFixed(0)}/100</span>
                </div>
                <span class="alert-time">${alert.datetime}</span>
            </div>
            <div class="alert-card-body">
                <p class="alert-reason">${alert.reason || 'Threat level exceeded threshold'}</p>
                <div class="alert-details">
                    <span>Source: ${alert.source}</span>
                    <span>Confidence: ${(alert.confidence * 100).toFixed(0)}%</span>
                    <span>Duration: ${alert.event_duration ? alert.event_duration.toFixed(1) + 's' : 'N/A'}</span>
                </div>
                ${alert.snapshot_url ? `<img src="${alert.snapshot_url}" class="alert-snapshot" alt="Alert snapshot" onerror="this.style.display='none'"/>` : ''}
                ${Object.keys(breakdown).length > 0 ? `
                <div class="alert-breakdown">
                    ${Object.entries(breakdown).map(([k, v]) => `
                        <div class="mini-breakdown">
                            <span>${k.replace(/_/g, ' ')}</span>
                            <div class="mini-bar"><div class="mini-fill" style="width:${Math.min(v, 100)}%"></div></div>
                            <span>${typeof v === 'number' ? v.toFixed(0) : v}%</span>
                        </div>
                    `).join('')}
                </div>` : ''}
            </div>
            <div class="alert-card-footer">
                ${!alert.acknowledged ? `<button class="btn btn-sm" onclick="acknowledgeAlert(${alert.id})">Acknowledge</button>` : '<span class="text-muted">✓ Acknowledged</span>'}
            </div>
        </div>`;
    }
    
    container.innerHTML = html;
}

async function acknowledgeAlert(id) {
    await fetch(`/api/alerts/${id}/acknowledge`, { method: 'POST' });
    loadAlerts(currentPage * pageSize);
}

function filterAlerts() {
    currentPage = 0;
    loadAlerts(0);
}

// Load alerts on page load
loadAlerts();

// Auto-refresh every 10 seconds
setInterval(() => loadAlerts(currentPage * pageSize), 10000);
</script>
{% endblock %}
